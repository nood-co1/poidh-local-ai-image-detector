<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>POIDH debug infer (test only)</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 16px;
        max-width: 480px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #555;
      }
      img {
        display: block;
        width: 128px;
        height: auto;
        margin: 8px 0;
        image-rendering: pixelated;
        background: #eee;
      }
      button {
        font-size: 13px;
        padding: 6px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #1a1a1a;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      #out {
        margin-top: 12px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>POIDH debug infer</h1>
    <p>
      Test-only page (not soul-3 evidence). Loads a same-origin fixture image and
      runs one ANALYZE_IMAGE via the service worker / offscreen session.
    </p>
    <img
      id="fixture"
      src="fixtures/assets/real_a.png"
      alt="debug fixture"
      width="64"
      height="48"
    />
    <button type="button" id="infer" disabled>Infer</button>
    <pre id="out">waiting for image…</pre>
    <script type="module" src="debug.js"></script>
  </body>
</html>
