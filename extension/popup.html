<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>POIDH Local AI Image Detector</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        margin: 12px;
        min-width: 280px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      #status {
        margin: 0 0 6px;
        font-size: 13px;
        color: #555;
      }
      #sha {
        margin: 0 0 10px;
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #666;
        word-break: break-all;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      button {
        font-size: 13px;
        padding: 6px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #f6f6f6;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #eee;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      button.primary {
        background: #1a1a1a;
        color: #fff;
        border-color: #1a1a1a;
      }
      button.primary:hover:not(:disabled) {
        background: #333;
      }
      #error {
        margin: 8px 0 0;
        font-size: 12px;
        color: #a30;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>POIDH AI Detector</h1>
    <p id="status">models not ready</p>
    <p id="sha"></p>
    <div class="actions">
      <button type="button" id="start" class="primary">Start setup</button>
      <button type="button" id="retry" hidden>Retry</button>
    </div>
    <p id="error"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
